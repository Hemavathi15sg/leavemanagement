<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Leave Management</title>
</head>
<body>
  <h1>Leave Management</h1>
  <table id="employees">
    <thead><tr><th>Name</th><th>Available days</th></tr></thead>
    <tbody></tbody>
  </table>
  <script>
    fetch("/api/employees")
      .then((r) => r.json())
      .then((rows) => {
        document.querySelector("#employees tbody").innerHTML =
          rows.map((e) => `<tr><td>${e.name}</td><td>${e.available_days}</td></tr>`).join("");
      });
  </script>
</body>
</html>
